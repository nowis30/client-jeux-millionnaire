name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci
      - name: API security regression tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hzyxrubwggcjueqkongh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_03fRORDfOBFt7PO7RcNEEA_zA8_fQbO
          NEXT_PUBLIC_APK_URL: ""
          NEXT_PUBLIC_TRAILER_YT: ""
          NEXT_PUBLIC_TRAILER_MP4: ""
          NEXT_PUBLIC_GITHUB_REPO: ""
          NEXT_PUBLIC_APK_FILENAME: ""
        run: npm run build

