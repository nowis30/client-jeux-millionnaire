name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --prefer-offline --no-audit
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://smwrpejnegtssmtmnecb.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3-7XDsd5zEd-3rrqr0-xgQ_kk0z3ArR
          NEXT_PUBLIC_APK_URL: ""
          NEXT_PUBLIC_TRAILER_YT: ""
          NEXT_PUBLIC_TRAILER_MP4: ""
          NEXT_PUBLIC_GITHUB_REPO: ""
          NEXT_PUBLIC_APK_FILENAME: ""
        run: npm run build
