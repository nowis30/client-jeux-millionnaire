<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic Drag Racing — Supabase</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 780px; margin: 2rem auto; padding: 0 1rem; background: #090d17; color: #e8eefc; }
    h1 { color: #7cffb0; }
    .panel { margin: 1rem 0; padding: 1rem; border: 1px solid #27324a; border-radius: .75rem; background: #12192a; }
    label { display: block; margin-bottom: .4rem; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #405070; border-radius: .5rem; background: #090d17; color: inherit; }
    button { margin: .35rem .25rem .35rem 0; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #7cffb0; color: #07100c; font-weight: 750; cursor: pointer; }
    pre { min-height: 3rem; overflow: auto; white-space: pre-wrap; padding: .75rem; border-radius: .5rem; background: #080c14; }
    .note { color: #b9c5dc; }
  </style>
</head>
<body>
  <h1>Diagnostic Drag Racing</h1>
  <p class="note">Collez un jeton <code>HM_TOKEN</code> valide. Il reste uniquement dans cette page et n’est jamais affiché dans le journal.</p>

  <div class="panel">
    <label for="token">Jeton d’accès Supabase</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
  </div>

  <div class="panel">
    <button type="button" onclick="health()">Santé API</button>
    <button type="button" onclick="games()">Lister les parties</button>
    <button type="button" onclick="join()">Rejoindre</button>
    <button type="button" onclick="dragSession()">Session Drag</button>
    <button type="button" onclick="dragResult()">Résultat test</button>
    <button type="button" onclick="fullFlow()">Exécuter le flux complet</button>
  </div>

  <pre id="log" aria-live="polite"></pre>

  <script>
    const API = 'https://smwrpejnegtssmtmnecb.supabase.co/functions/v1/heritier-api';
    let gameId = null;
    let playerId = null;
    let stage = 1;

    function write(label, value) {
      const line = `${new Date().toLocaleTimeString()} — ${label}${value === undefined ? '' : `\n${JSON.stringify(value, null, 2)}`}\n\n`;
      document.getElementById('log').textContent += line;
    }

    async function request(path, options = {}, authenticated = true) {
      const headers = new Headers(options.headers || {});
      if (authenticated) {
        const token = document.getElementById('token').value.trim();
        if (!token) throw new Error('Jeton HM_TOKEN requis');
        headers.set('Authorization', `Bearer ${token}`);
      }
      if (playerId) headers.set('X-Player-ID', playerId);
      if (options.body) headers.set('Content-Type', 'application/json');
      const response = await fetch(`${API}${path}`, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(`${response.status} — ${data.error || data.message || 'Erreur API'}`);
      return data;
    }

    async function run(label, action) {
      try {
        const data = await action();
        write(`✓ ${label}`, data);
        return data;
      } catch (error) {
        write(`✗ ${label}: ${error.message}`);
        throw error;
      }
    }

    async function health() {
      return run('Santé API', () => request('/health', {}, false));
    }

    async function games() {
      return run('Liste des parties', async () => {
        const data = await request('/api/games');
        gameId = data.games?.[0]?.id || null;
        if (!gameId) throw new Error('Aucune partie disponible');
        return data;
      });
    }

    async function join() {
      return run('Association du joueur', async () => {
        if (!gameId) await games();
        const data = await request(`/api/games/${gameId}/join`, { method: 'POST' });
        playerId = data.playerId;
        return data;
      });
    }

    async function dragSession() {
      return run('Session Drag', async () => {
        if (!playerId) await join();
        const data = await request(`/api/games/${gameId}/drag/session`);
        stage = Number(data.drag?.stage || 1);
        return data;
      });
    }

    async function dragResult() {
      return run('Résultat Drag', async () => {
        if (!playerId) await dragSession();
        return request(`/api/games/${gameId}/drag/result`, {
          method: 'POST',
          body: JSON.stringify({
            stage,
            elapsedMs: 7500,
            win: true,
            perfectShifts: 4,
            reward: 50000,
            device: { platform: 'diagnostic-html', build: 'supabase' }
          })
        });
      });
    }

    async function fullFlow() {
      document.getElementById('log').textContent = '';
      try {
        await health();
        await games();
        await join();
        await dragSession();
        await dragResult();
        write('✅ Flux complet réussi');
      } catch (_) {
        write('Flux interrompu après la première erreur');
      }
    }
  </script>
</body>
</html>
